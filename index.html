<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <base href="/math-lesson-pwa/" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#12344C" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=11" />
  <title>數學教案</title>
  <script>
    // One-shot: wipe stale PWA caches.
    (async () => {
      const VER = "v11-landscape";
      try {
        if (localStorage.getItem("mathPwaVer") === VER) return;
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
        }
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map((r) => r.unregister()));
        }
        localStorage.setItem("mathPwaVer", VER);
        location.reload();
      } catch (err) {
        console.warn(err);
      }
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="app.js?v=11"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js?v=11", { scope: "./" }).catch(console.warn);
      });
    }
  </script>
</body>
</html>
